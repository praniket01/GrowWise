services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: growwise
      POSTGRES_PASSWORD: growwise_dev_password
      POSTGRES_DB: growwise
    ports:
      - "5432:5432"
    volumes:
      - growwise_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growwise -d growwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ./apps/ai-service
    ports:
      - "8001:8001"
    environment:
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  growwise_postgres:
